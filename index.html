<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Oxbridge Playgroup English — Learning Games</title>
<link rel="icon" href="data:,">
<style>
:root{
  --emerald:#0B5D43; --emerald-deep:#07382A; --gold:#C9A227; --gold-soft:#E9CE7A;
  --ivory:#FBF7EC; --ink:#22332B; --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","Segoe UI",system-ui,sans-serif;
  background:linear-gradient(180deg,#EAF4EC 0%,var(--ivory) 55%,#F6ECD2 100%);
  color:var(--ink); touch-action:manipulation; user-select:none;-webkit-user-select:none;
  overflow-x:hidden;
}
/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--emerald);color:#fff;position:sticky;top:0;z-index:40;
  box-shadow:0 3px 10px rgba(7,56,42,.35);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{
  width:42px;height:42px;flex:0 0 42px;border-radius:50%;
  border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:24px;color:var(--gold-soft);background:var(--emerald-deep);
}
.brand h1{font-size:19px;letter-spacing:2.5px;line-height:1;color:#fff;white-space:nowrap}
.brand small{display:block;font-size:11.5px;letter-spacing:.4px;color:var(--gold-soft);margin-top:3px;font-weight:600}
header .spacer{flex:1}
.tgl{
  border:2px solid var(--gold);background:var(--emerald-deep);color:#fff;border-radius:999px;
  font-family:inherit;font-weight:700;font-size:13px;padding:8px 12px;cursor:pointer;
  display:flex;align-items:center;gap:6px;min-height:44px;
}
.tgl .ico{font-size:17px}
.tgl.off{opacity:.55;border-color:#9db8ab}
.tgl:active{transform:scale(.96)}
/* ---------- layout ---------- */
main{max-width:960px;margin:0 auto;padding:14px 14px 30px}
.screen{display:none}
.screen.active{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- home ---------- */
.welcome{
  display:flex;gap:14px;align-items:center;background:var(--card);border:3px solid var(--gold);
  border-radius:22px;padding:12px 16px;box-shadow:0 6px 18px rgba(11,93,67,.12);margin-bottom:16px;
}
.welcome img{width:86px;height:86px;object-fit:cover;border-radius:50%;border:3px solid var(--emerald);flex:0 0 86px}
.welcome .bubble{font-size:19px;font-weight:700;color:var(--emerald-deep);line-height:1.25;display:block;min-height:0}
.welcome .bubble span{display:block;font-size:14.5px;color:#5c6f65;font-weight:600;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.tile{
  background:var(--card);border:3px solid #D8E4DA;border-radius:20px;padding:10px 6px 8px;
  text-align:center;position:relative;cursor:pointer;font-family:inherit;color:var(--ink);
  box-shadow:0 4px 10px rgba(11,93,67,.08);transition:transform .15s;
}
.tile .L{font-size:44px;font-weight:800;color:var(--emerald);line-height:1}
.tile .L small{font-size:24px;color:#7fae97}
.tile img{width:64px;height:64px;object-fit:cover;border-radius:14px;margin:6px auto 2px;display:block}
.tile .w{font-size:14px;font-weight:700;color:#47604f;text-transform:capitalize}
.tile.ready{border-color:var(--gold);box-shadow:0 6px 16px rgba(201,162,39,.35)}
.tile.ready:active{transform:scale(.95)}
.tile .pill{
  position:absolute;top:-9px;right:-4px;background:var(--gold);color:#fff;font-size:11px;font-weight:800;
  padding:3px 9px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.2);letter-spacing:.3px;
}
.tile .pill.soon{background:#A9BCAE}
.tile.locked{cursor:default;opacity:.82}
.foot{text-align:center;margin-top:20px;color:#7c8f83;font-size:13px;font-weight:600}
.foot b{color:var(--emerald)}
/* ---------- game chrome ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.iconbtn{
  width:52px;height:52px;border-radius:16px;border:3px solid var(--gold);background:#fff;cursor:pointer;
  font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(11,93,67,.15);
}
.iconbtn:active{transform:scale(.94)}
.stars{display:flex;gap:4px;font-size:30px;line-height:1}
.stars .st{filter:grayscale(1);opacity:.35;transition:all .3s}
.stars .st.on{filter:none;opacity:1;animation:starPop .6s ease}
@keyframes starPop{0%{transform:scale(.2) rotate(-40deg)}60%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1)}}
.gems{margin-left:auto;background:var(--emerald);color:#fff;font-weight:800;font-size:17px;
  padding:8px 14px;border-radius:999px;border:2px solid var(--gold)}
#stage{
  background:var(--card);border:3px solid var(--emerald);border-radius:26px;min-height:380px;
  padding:18px 14px 22px;box-shadow:0 10px 24px rgba(11,93,67,.14);position:relative;overflow:hidden;
}
.hostrow{display:flex;gap:12px;align-items:flex-end;margin-top:12px}
.hostwrap{position:relative;flex:0 0 92px}
.hostwrap img{
  width:92px;height:92px;object-fit:cover;border-radius:50%;border:4px solid var(--gold);
  box-shadow:0 6px 14px rgba(11,93,67,.25);display:block;background:#DCEDE1;
}
.hostwrap.talking img{animation:talkBob .36s ease-in-out infinite alternate}
@keyframes talkBob{from{transform:translateY(0) rotate(-1.2deg)}to{transform:translateY(-5px) rotate(1.2deg)}}
.hostwrap.cheer img{animation:cheerJump .55s ease}
@keyframes cheerJump{0%{transform:translateY(0)}35%{transform:translateY(-18px) scale(1.06)}70%{transform:translateY(2px)}100%{transform:none)}}
.bubble{
  flex:1;background:#FFF8E1;border:3px solid var(--gold);border-radius:18px;padding:12px 16px;
  font-size:21px;font-weight:700;color:var(--emerald-deep);min-height:64px;display:flex;align-items:center;
  position:relative;line-height:1.3;
}
.bubble::before{
  content:"";position:absolute;left:-13px;bottom:22px;border:7px solid transparent;
  border-right:9px solid var(--gold);
}
/* ---------- phases ---------- */
.phase{text-align:center;animation:fadeIn .35s ease}
.bigbtn{
  font-family:inherit;font-size:24px;font-weight:800;color:#fff;background:var(--emerald);
  border:3px solid var(--gold);border-radius:999px;padding:16px 38px;cursor:pointer;
  box-shadow:0 8px 18px rgba(11,93,67,.3);margin-top:16px;min-height:64px;
}
.bigbtn:active{transform:scale(.95)}
.bigbtn.gold{background:var(--gold);color:var(--emerald-deep)}
.bookframe{
  display:inline-block;background:#fff;border:5px solid var(--gold);border-radius:14px;
  padding:8px;transform:rotate(-1.2deg);box-shadow:0 14px 30px rgba(7,56,42,.25);position:relative;
}
.bookframe img{height:min(430px,58vh);width:auto;max-width:82vw;border-radius:8px;display:block}
.bookframe .tag{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--emerald);color:#fff;
  font-weight:800;font-size:14.5px;padding:5px 16px;border-radius:999px;border:2px solid var(--gold);white-space:nowrap;
}
.giantletter{
  font-size:170px;font-weight:800;color:var(--emerald);line-height:1.05;cursor:pointer;
  text-shadow:0 4px 0 var(--gold-soft),0 10px 22px rgba(11,93,67,.25);display:inline-block;
  background:none;border:none;font-family:inherit;padding:0 18px;
}
.giantletter small{font-size:84px;color:#7fae97;text-shadow:0 3px 0 #dcebe1}
.giantletter.pulse{animation:letterPulse 1.1s ease-in-out infinite}
@keyframes letterPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07) rotate(-1.5deg)}}
.giantletter.boing{animation:boing .6s ease}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.22) rotate(3deg)}60%{transform:scale(.94)}100%{transform:scale(1)}}
.cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.wcard{
  background:#fff;border:4px solid #D8E4DA;border-radius:22px;padding:8px;cursor:pointer;
  width:min(200px,28vw);font-family:inherit;box-shadow:0 6px 14px rgba(11,93,67,.12);transition:transform .15s;
}
.wcard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:15px;display:block}
.wcard .wl{font-size:19px;font-weight:800;color:var(--emerald-deep);text-transform:capitalize;margin-top:5px}
.wcard:active{transform:scale(.96)}
.wcard.done{border-color:var(--gold);background:#FFF8E1;pointer-events:none;animation:bloom .7s ease}
@keyframes bloom{0%{transform:scale(1)}40%{transform:scale(1.13) rotate(-2deg)}100%{transform:scale(1.04)}}
.wcard.done{transform:scale(1.04)}
.wcard.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.wcard.hint{animation:hintWiggle .5s ease 2;border-color:var(--gold)}
@keyframes hintWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.05)}75%{transform:rotate(4deg) scale(1.05)}}
.countrow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.ccard{position:relative;background:none;border:none;cursor:pointer;padding:0;font-family:inherit}
.ccard img{width:min(170px,26vw);aspect-ratio:1;object-fit:cover;border-radius:20px;border:4px solid #D8E4DA;display:block;box-shadow:0 6px 14px rgba(11,93,67,.12)}
.ccard.counted img{border-color:var(--gold);animation:bloom .6s ease}
.ccard .num{
  position:absolute;top:-12px;right:-10px;width:52px;height:52px;border-radius:50%;
  background:var(--gold);color:#fff;font-size:28px;font-weight:800;display:none;
  align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);
}
.ccard.counted .num{display:flex;animation:starPop .5s ease}
.finishstars{font-size:74px;letter-spacing:8px;margin:8px 0 2px}
.finishstars .st{display:inline-block;filter:grayscale(1);opacity:.3}
.finishstars .st.on{filter:none;opacity:1;animation:starPop .7s ease both}
.finishmsg{font-size:27px;font-weight:800;color:var(--emerald)}
/* ---------- STEAM Play station ---------- */
.badges{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.badge{
  width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:22px;color:#fff;border:3px solid #fff;
  box-shadow:0 3px 8px rgba(11,93,67,.15);transition:all .3s;opacity:.32;filter:grayscale(.7);
}
.badge.b0{background:#E5639A}.badge.b1{background:#6A67A8}.badge.b2{background:#F08A1D}
.badge.b3{background:#A04E9E}.badge.b4{background:#3D9B47}
.badge.now{opacity:1;filter:none;transform:scale(1.2);animation:hintWiggle .6s ease 2}
.badge.on{opacity:1;filter:none}
.steamtext{margin-top:16px;font-size:14.5px;font-weight:600;color:#7c8f83;line-height:1.4}
.steamtext span{color:#47604f}
.wcard.page{width:auto}
.wcard.page img{width:auto;height:min(300px,44vh);aspect-ratio:auto}
.wcard .tick{
  position:absolute;top:-12px;right:-10px;width:46px;height:46px;border-radius:50%;
  background:var(--emerald);color:#fff;font-size:26px;font-weight:800;display:none;
  align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);
}
.wcard{position:relative}
.wcard.done .tick{display:flex;animation:starPop .5s ease}
.swatchrow{display:flex;gap:16px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.swatch{width:76px;height:76px;border-radius:50%;border:4px solid #fff;box-shadow:0 5px 12px rgba(0,0,0,.22);cursor:pointer;font-family:inherit}
.swatch:active{transform:scale(.9)}
.colourframe{display:inline-block;padding:10px;border:10px solid #D8E4DA;border-radius:24px;background:#fff;transition:border-color .35s,background .35s}
.colourframe img{width:min(240px,54vw);aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.colourframe.pagef img{width:auto;height:min(300px,44vh);aspect-ratio:auto}
.buildarea{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.stack{display:flex;flex-direction:column-reverse;align-items:center}
.block{width:150px;height:42px;border-radius:10px;margin-top:4px;border:3px solid rgba(0,0,0,.14);animation:fadeIn .3s ease}
.stonerow{display:flex;gap:9px;align-items:flex-end;justify-content:center;min-height:110px;flex-wrap:wrap}
.stone{width:72px;height:52px;border-radius:50%;background:#B9C0C4;border:3px solid #8F979C;display:flex;align-items:center;justify-content:center;font-size:24px;animation:fadeIn .3s ease}
.topper{width:104px;height:104px;object-fit:cover;border-radius:18px;border:4px solid var(--gold);margin-bottom:6px;animation:starPop .6s ease;background:#fff}
.patdisplay{display:flex;gap:10px;justify-content:center;margin:8px 0 18px;flex-wrap:wrap}
.patdot{width:50px;height:50px;border-radius:50%;border:4px solid #CFD8CF;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;color:#8A6D1A;background:#fff}
.patdot.k{background:#263238;border-color:#263238}
.patdot.q{background:#FFF3C4;border-style:dashed}
.patiles{display:flex;gap:22px;justify-content:center}
.patile{width:102px;height:102px;border-radius:24px;background:#fff;border:4px solid #D8E4DA;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.patile:active{transform:scale(.94)}
.patile .patdot{width:62px;height:62px}
.patile.shake{animation:shake .45s ease}
/* ---------- STEAM Perform — observe activities are PERFORMED ----------
   Tapping a hero picture starts its process on this stage: the ant
   walks, the apple tree grows stage by stage, the ice melts... The
   book crops themselves are never altered — transforms only.        */
.perfstage{
  position:relative;height:min(320px,47vh);min-height:250px;border-radius:22px;overflow:hidden;
  border:4px solid #D8E4DA;background:linear-gradient(#F2F9F0 0%,#E4F1E1 62%,#EFE3BC 62.2%,#E9D9AE 100%);
  box-shadow:inset 0 -14px 24px rgba(150,120,50,.12);margin-bottom:6px;
}
.perfslot{position:absolute;inset:0}
.perfground{
  position:absolute;left:0;right:0;bottom:0;height:34px;
  background:linear-gradient(#E7D29C,#D9BE7E);border-top:3px solid #C9A95F;
}
.actor{
  --aw:min(168px,42vw);
  position:absolute;bottom:44px;left:50%;width:var(--aw);margin-left:calc(var(--aw) / -2);z-index:2;
}
.actor.wide{--aw:min(300px,76vw)}
.actor .bob{will-change:transform}
.actor img{
  width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;display:block;
  border:4px solid #fff;box-shadow:0 8px 18px rgba(11,93,67,.25);background:#fff;
}
.actor.wide img{aspect-ratio:auto;height:min(180px,34vh)}
.actor.round img{border-radius:50%}
.actor .ashadow{
  position:absolute;left:10%;right:10%;bottom:-13px;height:15px;z-index:-1;
  background:radial-gradient(ellipse at center,rgba(80,55,20,.38),transparent 70%);
}
/* the living ant — a drawn character performs; the book picture is
   never moved (owner's correction). JS drives it with translate3d. */
.actor.antactor{
  left:0;bottom:24px;margin-left:0;width:min(148px,40vw);will-change:transform;
}
.antsvg{width:100%;height:auto;display:block;overflow:visible}
.perflabel{
  position:absolute;left:0;right:0;bottom:5px;z-index:4;text-align:center;
  font-size:19px;font-weight:800;color:var(--emerald-deep);
  text-shadow:0 1px 0 #fff,0 0 8px rgba(255,255,255,.8);padding:0 10px;
}
.againbtn{
  position:absolute;top:10px;right:10px;z-index:5;font-family:inherit;cursor:pointer;
  background:var(--gold);color:var(--emerald-deep);font-weight:800;font-size:16.5px;
  border:3px solid #fff;border-radius:999px;padding:8px 16px;
  box-shadow:0 5px 14px rgba(11,93,67,.3);animation:hintWiggle .7s ease 2;
}
.againbtn:active{transform:scale(.94)}
.wcard .replay{
  position:absolute;top:-12px;left:-10px;width:46px;height:46px;border-radius:50%;
  background:var(--gold);color:#fff;font-size:25px;font-weight:800;display:none;
  align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);
}
.wcard.canreplay .replay{display:flex;animation:starPop .5s ease}
.fx{position:absolute;pointer-events:none;z-index:3}
.fx.dust{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle,rgba(216,196,154,.85) 0%,transparent 70%)}
.fx.bub{width:12px;height:12px;border-radius:50%;border:2px solid rgba(110,170,220,.85);background:rgba(185,222,246,.4)}
.fx.ring{width:130px;height:130px;border-radius:50%;border:5px solid rgba(201,162,39,.7)}
.fx.puff{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(228,228,228,.1) 72%);filter:blur(1px)}
.fx.drop{width:5px;height:17px;border-radius:4px;background:#5B9BD5;z-index:2;animation:rainfall .75s linear infinite}
@keyframes rainfall{from{transform:translateY(-26px);opacity:0}18%{opacity:.9}to{transform:translateY(330px);opacity:.15}}
.fx.halo{border-radius:50%;background:radial-gradient(circle,rgba(255,214,64,.55) 0%,rgba(255,214,64,0) 68%)}
.fx.puddle{height:18px;border-radius:50%;background:rgba(91,155,213,.5)}
.fx.clipdot{width:16px;height:23px;border-radius:6px;background:#9AA3A8;border:2px solid #6E777C}
.perfbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.yostring{position:absolute;left:50%;bottom:100%;width:3px;height:76px;background:#8d8d8d;border-radius:2px;transform:translateX(-50%)}
/* growth diagram (flat, book colour family) */
.growwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.growwrap svg{height:96%;max-width:min(440px,92vw)}
.grow-el{opacity:0;transform:scale(.15);transform-box:fill-box;transform-origin:50% 100%;transition:transform .95s ease,opacity .65s ease}
.grow-el.show{opacity:1;transform:scale(1)}
.grow-el.hide{opacity:0;transform:scale(.5)}
.growend{
  position:absolute;right:8px;bottom:10px;width:min(96px,24vw);height:min(96px,24vw);object-fit:cover;
  border-radius:16px;border:4px solid var(--gold);background:#fff;z-index:3;
  opacity:0;transform:scale(.3) rotate(-10deg);transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .4s;
  box-shadow:0 8px 18px rgba(11,93,67,.3);
}
.growend.show{opacity:1;transform:scale(1) rotate(-3deg)}
.sparkle{
  position:absolute;font-size:24px;pointer-events:none;z-index:5;
  animation:sparkFly .85s ease-out forwards;
}
@keyframes sparkFly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.25);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
@media (max-width:480px){
  .brand h1{font-size:16px;letter-spacing:1.6px}
  .brand small{font-size:10.5px}
  .tgl{font-size:11.5px;padding:7px 9px}
  .giantletter{font-size:128px}
  .giantletter small{font-size:62px}
  .bubble{font-size:18.5px}
  #stage{min-height:340px}
  .hostwrap{flex-basis:74px}
  .hostwrap img{width:74px;height:74px}
  .welcome img{width:70px;height:70px;flex-basis:70px}
  .welcome .bubble{font-size:16.5px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">O</div>
    <h1>OXBRIDGE<small>Playgroup English · Learning Games</small></h1>
  </div>
  <div class="spacer"></div>
  <button class="tgl" id="tglVoice" aria-label="Toggle voice"><span class="ico">🔊</span><span>Voice</span></button>
  <button class="tgl" id="tglMusic" aria-label="Toggle music"><span class="ico">🎵</span><span>Music</span></button>
</header>

<main>
  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <div class="welcome">
      <img id="homeHost" alt="Your book friend">
      <div class="bubble">Hello! Let us play with your book!<span>Tap a letter to start. All the pictures are from your own book!</span></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="foot"><b>Oxbridge Education</b> · English Level 1 · Playgroup</p>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <div class="topbar">
      <button class="iconbtn" id="btnHome" aria-label="Home">🏠</button>
      <div class="stars" id="starBar"><span class="st">⭐</span><span class="st">⭐</span><span class="st">⭐</span><span class="st">⭐</span></div>
      <div class="gems">💎 <span id="gemCount">0</span></div>
    </div>
    <div id="stage"></div>
    <div class="hostrow">
      <div class="hostwrap" id="hostWrap"><img id="hostImg" alt="Your book friend"></div>
      <div class="bubble" id="hostBubble">Hello!</div>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script>
"use strict";
const DATA = window.GAME_DATA;
const $ = s => document.querySelector(s);
const stage = $('#stage'), bubble = $('#hostBubble'), hostWrap = $('#hostWrap');

/* ================= VOICE — female Pakistani / Indian English, slow =================
   Picker order: en-PK female → en-IN female → en-IN any → en-GB/US female →
   en-PK any → other English. Rate 0.82, pitch 1.05: slow and clear so
   playgroup children can follow.
   Speech-Gate (Standard 13): a FIFO queue; every line must finish before
   the game advances; VOICE OFF releases every gate instantly.            */
const Voice = {
  enabled: true, rate: 0.82, pitch: 1.05,
  voice: null, queue: [], busy: false, token: 0,
  FEMALE: /female|heera|neerja|veena|swara|asha|ananya|kavya|priya|meera|zira|samantha|anita|sunita/i,
  score(v){
    const name = v.name || '', lang = (v.lang || '').toLowerCase().replace('_','-');
    const fem = this.FEMALE.test(name);
    if (lang.indexOf('en-pk') === 0 && fem) return 100;
    if (lang.indexOf('en-in') === 0 && fem) return 90;
    if (lang.indexOf('en-in') === 0) return 80;
    if (lang.indexOf('en-gb') === 0 && fem) return 70;
    if (lang.indexOf('en-us') === 0 && fem) return 65;
    if (lang.indexOf('en-pk') === 0) return 60;
    if (lang.indexOf('en-gb') === 0) return 50;
    if (lang.indexOf('en-us') === 0) return 45;
    if (lang.indexOf('en') === 0) return 30;
    return -1;
  },
  pick(){
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    let best = null, bs = -1;
    for (const v of vs){ const s = this.score(v); if (s > bs){ bs = s; best = v; } }
    this.voice = best;
  },
  say(text){
    return new Promise(resolve => {
      if (!this.enabled || !('speechSynthesis' in window)){ resolve(); return; }
      this.queue.push({ text, resolve });
      this.pump();
    });
  },
  pump(){
    if (this.busy || !this.queue.length){ this.syncHost(); return; }
    const item = this.queue.shift();
    this.busy = true; this.syncHost();
    const my = ++this.token;
    let done = false;
    const finish = () => {
      if (done || my !== this.token) return;
      done = true; clearTimeout(wd);
      this.busy = false; item.resolve(); this.pump();
    };
    const words = item.text.trim().split(/\s+/).length;
    const wd = setTimeout(() => { try{ speechSynthesis.cancel(); }catch(e){} finish(); },
      Math.min(25000, Math.max(4000, 1800 + 620 * words)));
    try {
      const u = new SpeechSynthesisUtterance(item.text);
      if (this.voice) u.voice = this.voice;
      u.rate = this.rate; u.pitch = this.pitch;
      u.onend = finish; u.onerror = finish;
      speechSynthesis.speak(u);
    } catch(e){ finish(); }
  },
  syncHost(){
    hostWrap.classList.toggle('talking', this.enabled && (this.busy || this.queue.length > 0));
    Music.duck(this.busy || this.queue.length > 0);
  },
  setEnabled(on){
    this.enabled = on;
    if (!on){
      this.token++;
      try{ speechSynthesis.cancel(); }catch(e){}
      const q = this.queue; this.queue = []; this.busy = false;
      q.forEach(i => i.resolve());
    }
    this.syncHost();
  },
  cheer(){
    hostWrap.classList.remove('cheer'); void hostWrap.offsetWidth;
    hostWrap.classList.add('cheer');
  }
};
if ('speechSynthesis' in window){
  Voice.pick();
  speechSynthesis.onvoiceschanged = () => Voice.pick();
}

/* ================= MUSIC + SFX (WebAudio synth, soft) ================= */
const Music = {
  ctx: null, master: null, sfxGain: null, on: true, timer: null, step: 0,
  NOTES: [329.6, 392.0, 440.0, 392.0, 329.6, 293.7, 261.6, 293.7], // E G A G E D C D
  ensure(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.0;
      this.master.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.16;
      this.sfxGain.connect(this.ctx.destination);
      this.master.gain.linearRampToValueAtTime(this.on ? 0.05 : 0.0, this.ctx.currentTime + 1.2);
      this.timer = setInterval(() => this.tick(), 460);
    } catch(e){}
  },
  tick(){
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    const f = this.NOTES[this.step % this.NOTES.length];
    this.tone(f, t, 0.42, 'triangle', 0.5, this.master);
    if (this.step % 4 === 0) this.tone(130.8, t, 0.9, 'sine', 0.35, this.master); // soft C bass
    this.step++;
  },
  tone(freq, t, dur, type, vol, dest){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  },
  duck(on){
    if (!this.ctx || !this.master) return;
    const target = this.on ? (on ? 0.015 : 0.05) : 0.0;
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.linearRampToValueAtTime(target, this.ctx.currentTime + 0.25);
  },
  setOn(on){
    this.on = on;
    if (this.ctx && this.master){
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.linearRampToValueAtTime(on ? 0.05 : 0.0, this.ctx.currentTime + 0.3);
    }
  },
  sfx(kind){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    if (kind === 'pop'){ this.tone(620, t, 0.12, 'square', 0.25, this.sfxGain); this.tone(930, t + 0.05, 0.12, 'square', 0.2, this.sfxGain); }
    else if (kind === 'good'){ [523.3, 659.3, 783.0].forEach((f, i) => this.tone(f, t + i * 0.09, 0.22, 'triangle', 0.5, this.sfxGain)); }
    else if (kind === 'star'){ [783.0, 987.8, 1174.7].forEach((f, i) => this.tone(f, t + i * 0.1, 0.3, 'sine', 0.5, this.sfxGain)); }
    else if (kind === 'try'){ this.tone(220, t, 0.25, 'sine', 0.35, this.sfxGain); this.tone(196, t + 0.12, 0.3, 'sine', 0.3, this.sfxGain); }
    else if (kind === 'fanfare'){ [523.3, 659.3, 783.0, 1046.5].forEach((f, i) => this.tone(f, t + i * 0.13, 0.4, 'triangle', 0.55, this.sfxGain)); }
  }
};
window.addEventListener('pointerdown', () => Music.ensure(), { once: false });

/* ================= helpers ================= */
const PRAISE = ['Well done!', 'Great job!', 'Wonderful!', 'Super!', 'Very good!', 'You did it!'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; };
function sayBubble(text){ bubble.textContent = text; return Voice.say(text); }
function sparkles(el, n){
  const host = stage, r = el.getBoundingClientRect(), sr = host.getBoundingClientRect();
  const cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height / 2;
  for (let i = 0; i < (n || 8); i++){
    const s = document.createElement('span');
    s.className = 'sparkle'; s.textContent = pick(['⭐','✨','🌟','💛']);
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--dx', (Math.random() * 170 - 85) + 'px');
    s.style.setProperty('--dy', (Math.random() * -130 - 10) + 'px');
    host.appendChild(s); setTimeout(() => s.remove(), 900);
  }
}
const Confetti = {
  parts: [], raf: null,
  burst(n){
    const cv = $('#confetti'); cv.style.display = 'block';
    cv.width = innerWidth; cv.height = innerHeight;
    const colors = ['#0B5D43', '#C9A227', '#E9CE7A', '#ffffff', '#F2A7C3'];
    for (let i = 0; i < (n || 90); i++){
      this.parts.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.35,
        w: 6 + Math.random() * 7, h: 8 + Math.random() * 8, vy: 2 + Math.random() * 3.2,
        vx: Math.random() * 2 - 1, rot: Math.random() * 6.3, vr: Math.random() * 0.2 - 0.1,
        c: colors[i % colors.length] });
    }
    if (!this.raf) this.loop();
  },
  loop(){
    const cv = $('#confetti'), ctx = cv.getContext('2d');
    const draw = () => {
      ctx.clearRect(0, 0, cv.width, cv.height);
      this.parts = this.parts.filter(p => p.y < cv.height + 30);
      for (const p of this.parts){
        p.y += p.vy; p.x += p.vx + Math.sin(p.y / 30) * 0.8; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
      if (this.parts.length){ this.raf = requestAnimationFrame(draw); }
      else { this.raf = null; cv.style.display = 'none'; }
    };
    this.raf = requestAnimationFrame(draw);
  }
};
function setStars(n){
  document.querySelectorAll('#starBar .st').forEach((el, i) => el.classList.toggle('on', i < n));
}
function setGems(n){ $('#gemCount').textContent = n; }

/* ================= screens ================= */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#' + id).classList.add('active');
  window.scrollTo(0, 0);
}
function buildGrid(){
  const g = $('#grid'); g.innerHTML = '';
  for (const L of DATA.letters){
    const b = document.createElement('button');
    b.className = 'tile' + (L.ready ? ' ready' : ' locked');
    b.innerHTML = `<span class="pill ${L.ready ? '' : 'soon'}">${L.ready ? '▶ PLAY' : 'SOON'}</span>
      <div class="L">${L.letter}<small>${L.upper}</small></div>
      <img src="${L.words[0].img}" alt="${L.words[0].word}">
      <div class="w">${L.words[0].word}</div>`;
    if (L.ready) b.addEventListener('click', () => { Music.ensure(); openLetter(L); });
    g.appendChild(b);
  }
}

/* ================= the game ================= */
let G = null;
function openLetter(L){
  G = { L, gems: 0 };
  setStars(0); setGems(0);
  show('screen-game');
  phaseBook();
}
function phaseBook(){
  const L = G.L;
  stage.innerHTML = `<div class="phase">
      <div class="bookframe"><span class="tag">📖 Your book page · Page ${L.page}</span>
      <img src="${L.pageImg}" alt="Your book page for letter ${L.upper}"></div>
      <div><button class="bigbtn" id="btnPlay">▶ Let's Play!</button></div>
    </div>`;
  sayBubble(`Look! This is your book page!`);
  Voice.say(`Let's play with the letter ${L.upper}!`);
  $('#btnPlay').addEventListener('click', () => { Music.ensure(); Music.sfx('pop'); phaseMeet(); });
}
async function phaseMeet(){
  const L = G.L;
  stage.innerHTML = `<div class="phase">
      <button class="giantletter" id="bigLetter">${L.letter} <small>${L.upper}</small></button>
      <p style="font-size:19px;font-weight:700;color:#5c6f65;margin-top:6px">Tap the letter!</p>
    </div>`;
  const el = $('#bigLetter');
  await sayBubble(`This is the letter ${L.upper}.`);
  await Voice.say(`${L.upper} says ${L.soundSay}. ${L.soundSay}, ${L.soundSay}, ${L.words[0].say}!`);
  el.classList.add('pulse');
  el.addEventListener('click', async () => {
    el.classList.remove('pulse'); el.classList.add('boing');
    Music.sfx('good'); sparkles(el, 10); Voice.cheer();
    setStars(1); Music.sfx('star');
    await Voice.say(pick(PRAISE));
    phaseTap();
  }, { once: true });
}
async function phaseTap(){
  const L = G.L;
  stage.innerHTML = `<div class="phase"><div class="cards" id="cards"></div></div>`;
  const wrap = $('#cards');
  const cards = {};
  for (const w of L.words){
    const c = document.createElement('button');
    c.className = 'wcard'; c.dataset.word = w.word;
    c.innerHTML = `<img src="${w.img}" alt="${w.word}"><div class="wl">${w.word}</div>`;
    wrap.appendChild(c); cards[w.word] = c;
  }
  const order = shuffle(L.words);
  for (const target of order){
    let misses = 0;
    await sayBubble(`Tap the ${target.say}!`);
    await new Promise(resolve => {
      const onTap = e => {
        const card = e.target.closest('.wcard');
        if (!card || card.classList.contains('done')) return;
        if (card.dataset.word === target.word){
          card.classList.add('done');
          G.gems++; setGems(G.gems);
          Music.sfx('good'); sparkles(card, 9); Voice.cheer();
          wrap.removeEventListener('click', onTap);
          Voice.say(pick(PRAISE)).then(resolve);
        } else {
          misses++;
          card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
          Music.sfx('try');
          if (misses >= 2){
            cards[target.word].classList.add('hint');
            Voice.say(`Look! Here is the ${target.say}!`);
            setTimeout(() => cards[target.word].classList.remove('hint'), 1600);
          } else {
            Voice.say('Try again!');
          }
        }
      };
      wrap.addEventListener('click', onTap);
    });
  }
  setStars(2); Music.sfx('star');
  phaseCount();
}
async function phaseCount(){
  const L = G.L, C = L.count;
  stage.innerHTML = `<div class="phase"><div class="countrow" id="crow"></div></div>`;
  const row = $('#crow');
  const cards = [];
  for (let i = 0; i < C.n; i++){
    const c = document.createElement('button');
    c.className = 'ccard';
    c.innerHTML = `<img src="${C.img}" alt="${C.word}"><span class="num">${i + 1}</span>`;
    row.appendChild(c); cards.push(c);
  }
  await sayBubble(`Let's count the ${C.plural}! Tap each one!`);
  const NUMS = ['One!', 'Two!', 'Three!', 'Four!', 'Five!'];
  let counted = 0, busyNum = false;
  await new Promise(resolve => {
    cards.forEach((c, idx) => {
      c.addEventListener('click', async () => {
        if (c.classList.contains('counted') || busyNum) return;
        busyNum = true;
        c.classList.add('counted'); Music.sfx('pop'); sparkles(c, 5);
        counted++;
        await Voice.say(NUMS[idx]);
        busyNum = false;
        if (counted === C.n) resolve();
      });
    });
  });
  await Voice.say(`${C.n === 3 ? 'Three' : C.n} ${C.plural}! ${pick(PRAISE)}`);
  setStars(3); Music.sfx('star');
  phaseSteam();
}
/* ================= STEAM Play — every letter page's own STEAM box =================
   The 5 printed strand activities (Science, Technology, Engineering, Art,
   Mathematics) transformed into tap-play, using the corrected-edition
   texts and the page's own book pictures. Each cell: 1-4 taps, no timer,
   praise per cell, S·T·E·A·M badge fills as each strand is done. The
   printed cell text stays visible in small type under the play area.
   Observe cells are PERFORMED, not just tapped — see steamPerform.   */
function wordObj(name){ return G.L.words.find(w => w.word === name); }

async function steamObserve(cell){
  const L = G.L, play = $('#steamPlay');
  await sayBubble(cell.text);
  const items = cell.page
    ? [{ img: L.pageImg, label: 'Your book page', page: true }]
    : cell.imgs.map(n => { const w = wordObj(n); return { img: w.img, label: w.word }; });
  play.innerHTML = `<div class="cards">${items.map(it => `
      <button class="wcard obspic${it.page ? ' page' : ''}">
        <img src="${it.img}" alt="${it.label}"><span class="tick">✓</span>
        <div class="wl">${it.label}</div>
      </button>`).join('')}</div>`;
  let left = items.length;
  await new Promise(resolve => {
    play.querySelectorAll('.obspic').forEach(card => {
      card.addEventListener('click', () => {
        if (card.classList.contains('done')) return;
        card.classList.add('done'); Music.sfx('pop'); sparkles(card, 6);
        if (--left === 0) resolve();
      });
    });
  });
}
/* ================= STEAM Perform — observe it HAPPEN =================
   Owner's order: when a STEAM activity asks the child to OBSERVE a
   process, the game PERFORMS it. Tap the ant → it walks in its natural
   way. Tap the apple → the apple tree grows, stage by stage. The book
   crops are never altered — every motion is transforms on the crop —
   except the growth sequences, which are flat explanatory diagrams in
   the book's colour family and end with the book's own fruit picture.
   And one owner's correction on top: the ANT is not its picture moved
   at all — the book ant stays still as the tap card while a DRAWN
   living ant (perfAnt, data flag `live`) walks on stage like a real
   ant: tripod gait, stop-start scurries, antennae exploring.
   Performances run UNDER the host's spoken line (same slow voice and
   speech gates); after a performance the hero can be tapped again to
   replay it ("Watch again"). Mapping for all 45 observe cells lives in
   build/perf-map.py (data.js `perf` arrays).                        */
const waitP = ms => new Promise(r => setTimeout(r, ms));
function A(el, frames, opts){
  const a = el.animate(frames, Object.assign({ fill: 'forwards' }, opts || {}));
  return a.finished.catch(() => {});
}
function fxSpawn(slot, cls, styles){
  const s = document.createElement('span');
  s.className = 'fx ' + cls;
  Object.assign(s.style, styles || {});
  slot.appendChild(s); return s;
}
function relC(el, slot){
  const r = el.getBoundingClientRect(), s = slot.getBoundingClientRect();
  return { cx: r.left - s.left + r.width / 2, cy: r.top - s.top + r.height / 2,
           bottom: r.bottom - s.top, w: r.width };
}
const PERF_SAY = {
  walk: w => `Look! The ${w} is walking!`,
  hop: w => `Look! The ${w} is hopping! Hop, hop, hop!`,
  swim: w => `Look! The ${w} is swimming!`,
  fly: w => `Look! The ${w} is flying!`,
  rise: w => `Look! The ${w} goes up, up, up!`,
  roll: w => `Look! The ${w} is rolling!`,
  spin: w => `Look! The ${w} goes round and round!`,
  glow: w => `Look! The ${w} is shining!`,
  melt: w => `Look! The ${w} is melting!`,
  flow: w => `Look! The ${w} is flowing!`,
  wave: w => `Look and listen! The ${w} makes a sound!`,
  updown: w => `Look! The ${w} goes up and down!`,
  attract: w => `Look! They are pulled in!`
};
function dustTrail(actor, slot, cls, every){
  return setInterval(() => {
    const c = relC(actor, slot);
    const d = fxSpawn(slot, cls, { left: (c.cx - 8) + 'px', top: (c.bottom - 16) + 'px' });
    A(d, [{ transform: 'scale(.4)', opacity: .55 }, { transform: 'scale(1.35) translateY(-9px)', opacity: 0 }], { duration: 700 })
      .then(() => d.remove());
  }, every);
}
const PERF_ANIM = {
  async walk(actor, p, slot){
    const flip = actor.querySelector('.flip'), bob = actor.querySelector('.bob');
    const dist = Math.max(88, Math.min(slot.clientWidth * 0.30, 235));
    const R = `translateX(${dist}px)`, L = `translateX(${-dist}px)`;
    const bobF = { transform: ['translateY(0) rotate(-2deg)', 'translateY(-5px) rotate(2deg)',
      'translateY(0) rotate(-2deg)', 'translateY(-5px) rotate(2deg)', 'translateY(0) rotate(-2deg)'] };
    let dust = dustTrail(actor, slot, 'dust', 430);
    await Promise.all([A(actor, [{ transform: R }, { transform: L }], { duration: 3600, easing: 'ease-in-out' }),
                       A(bob, bobF, { duration: 3600 })]);
    clearInterval(dust);
    // pause: a little antennae-feel wiggle, then turn around
    await A(bob, { transform: ['rotate(0deg)', 'rotate(-4deg)', 'rotate(4deg)', 'rotate(-4deg)', 'rotate(0deg)'] }, { duration: 850 });
    await A(flip, { transform: ['scaleX(1)', 'scaleX(-1)'] }, { duration: 260 });
    dust = dustTrail(actor, slot, 'dust', 430);
    await Promise.all([A(actor, [{ transform: L }, { transform: R }], { duration: 3600, easing: 'ease-in-out' }),
                       A(bob, bobF, { duration: 3600 })]);
    clearInterval(dust);
    await A(flip, { transform: ['scaleX(-1)', 'scaleX(1)'] }, { duration: 260 });
  },
  async hop(actor){
    const xs = [-52, -26, 0, 26, 52, 26, 0, -26, -52];
    const frames = xs.map((x, i) => ({ transform: `translateX(${x}px) translateY(${i % 2 ? -50 : 0}px)` }));
    const bob = actor.querySelector('.bob');
    await Promise.all([A(actor, frames, { duration: 3600, easing: 'ease-in-out' }),
      A(bob, { transform: ['rotate(-3deg)', 'rotate(3deg)', 'rotate(-3deg)'] }, { duration: 1200, iterations: 3 })]);
  },
  async swim(actor, p, slot){
    const dist = Math.max(80, Math.min(slot.clientWidth * 0.28, 220));
    const leg = (from, to, yOff, dur) => A(actor, [
      { transform: `translateX(${from}px) translateY(${yOff}px)` },
      { transform: `translateX(${(from + to) / 2}px) translateY(${yOff - 15}px)` },
      { transform: `translateX(${to}px) translateY(${yOff}px)` }], { duration: dur, easing: 'ease-in-out' });
    const bob = actor.querySelector('.bob');
    const bobP = A(bob, { transform: ['rotate(-6deg)', 'rotate(6deg)', 'rotate(-6deg)'] }, { duration: 1400, iterations: 5 });
    const bub = setInterval(() => {
      const c = relC(actor, slot);
      const b = fxSpawn(slot, 'bub', { left: (c.cx + c.w / 3) + 'px', top: (c.cy - 6) + 'px' });
      A(b, [{ transform: 'translateY(0)', opacity: .9 }, { transform: 'translateY(-64px)', opacity: 0 }], { duration: 1100 })
        .then(() => b.remove());
    }, 520);
    await leg(dist, -dist, 0, 4000);
    await leg(-dist, dist, -16, 3400);
    clearInterval(bub); await bobP;
  },
  async fly(actor, p, slot){
    const dist = Math.max(85, Math.min(slot.clientWidth * 0.30, 230));
    const bob = actor.querySelector('.bob');
    await Promise.all([
      A(actor, [
        { transform: `translateX(${-dist}px) translateY(6px)` },
        { transform: `translateX(${-dist / 2}px) translateY(-72px)` },
        { transform: `translateX(0px) translateY(-38px)` },
        { transform: `translateX(${dist / 2}px) translateY(-78px)` },
        { transform: `translateX(${dist}px) translateY(-24px)` },
        { transform: `translateX(0px) translateY(0px)` }], { duration: 5600, easing: 'ease-in-out' }),
      A(bob, { transform: ['rotate(-8deg)', 'rotate(8deg)', 'rotate(-8deg)'] }, { duration: 900, iterations: 6 })]);

      <ellipse cx="172" cy="112" rx="16" ry="8" fill="#37A24B" transform="rotate(28 172 112)"/>
      <ellipse cx="158" cy="82" rx="14" ry="7" fill="#2E8B3E" transform="rotate(14 158 82)"/>
      <path d="M152 92 q16 -4 14 -18" stroke="#2E8B3E" stroke-width="3.4" fill="none" stroke-linecap="round"/></g>
    <g class="grow-el gs-fruit">${fruitPlant}</g></svg>`;
}
async function perfGrow(slot, label, p, L){
  const F = PERF_FRUITS[p.fruit] || PERF_FRUITS.apple;
  const w = wordObj(p.img);
  slot.innerHTML = `<div class="growwrap">${growSVG(p.do, F)}<img class="growend" src="${w.img}" alt="${w.word}"></div>`;
  const svg = slot.querySelector('svg');
  const stages = p.do === 'grow-tree' ? [
    ['.gs-seed', 'A tiny seed in the soil.'],
    ['.gs-sprout', 'A little sprout comes out!'],
    ['.gs-plant', 'It grows into a small plant.'],
    ['.gs-tree', 'Now it is a big tree!'],
    ['.gs-flowers', 'Pretty flowers grow on the tree!'],
    ['.gs-fruit', `${F.adj} ${F.plural} grow on the tree!`]
  ] : [
    ['.gs-seed', 'A tiny seed in the soil.'],
    ['.gs-sprout', 'A little sprout comes out!'],
    ['.gs-plant', 'It grows into a green plant.'],
    ['.gs-leaves', 'Leaves grow and grow!'],
    ['.gs-fruit', `${F.adj} ${F.plural} grow!`]
  ];
  const swap = { '.gs-sprout': '.gs-seed', '.gs-plant': '.gs-sprout', '.gs-tree': '.gs-plant' };
  for (const [sel, line] of stages){
    if (swap[sel]){ const prev = svg.querySelector(swap[sel]); if (prev) prev.classList.add('hide'); }
    const el = svg.querySelector(sel);
    if (el) el.classList.add('show');
    label.textContent = line;
    Music.sfx('pop');
    await Promise.all([Voice.say(line), waitP(1950)]);
  }
  const end = slot.querySelector('.growend');
  end.classList.add('show');
  sparkles(end, 9); Music.sfx('good');
  label.textContent = `Your book ${w.word}!`;
  await Promise.all([Voice.say(`Look! Your book ${w.say}!`), waitP(1100)]);
}
async function runPerformance(slot, label, p, L){
  slot.innerHTML = ''; label.textContent = '';
  if (p.do === 'grow-tree' || p.do === 'grow-plant') return perfGrow(slot, label, p, L);
  if (p.do === 'flow' && p.variant === 'rain'){
    label.textContent = p.say || '';
    await Promise.all([perfRain(slot, L), p.say ? Voice.say(p.say) : Promise.resolve()]);
    return;
  }
  const w = p.page ? null : wordObj(p.img);
  const src = p.page ? L.pageImg : w.img;
  const say = p.say || (PERF_SAY[p.do] && w ? PERF_SAY[p.do](w.say) : null);
  if (p.live){ /* the living ant: drawn character, picture never moves */
    label.textContent = say || '';
    await Promise.all([perfAnt(slot), say ? Voice.say(say) : Promise.resolve(), waitP(900)]);
    return;
  }
  const round = p.do === 'roll' || p.do === 'spin';
  slot.innerHTML = `<div class="actor${round ? ' round' : ''}${p.page ? ' wide' : ''}">
      <div class="flip"><div class="bob"><img src="${src}" alt="${w ? w.word : 'Your book page'}"></div></div>
      <div class="ashadow"></div></div>`;
  const actor = slot.firstElementChild;
  label.textContent = say || '';
  const animP = (PERF_ANIM[p.do] || PERF_ANIM.look)(actor, p, slot);
  await Promise.all([animP, say ? Voice.say(say) : Promise.resolve(), waitP(900)]);
}
function perfLabel(p, L){ return p.page ? 'book page' : wordObj(p.img).say; }
async function steamPerform(cell){
  const L = G.L, play = $('#steamPlay');
  if (!cell.perf || !cell.perf.length) return steamObserve(cell);
  await sayBubble(cell.text);
  play.innerHTML = `
    <div class="perfstage" id="perfStage">
      <div class="perfground"></div>
      <div class="perfslot" id="perfSlot"></div>
      <div class="perflabel" id="perfLabel"></div>
      <button class="againbtn" id="againBtn" hidden>↻ Watch again!</button>
    </div>
    <div class="cards">${cell.perf.map((p, i) => {
      const src = p.page ? L.pageImg : wordObj(p.img).img;
      const label = p.page ? 'Your book page' : wordObj(p.img).word;
      return `<button class="wcard obspic perfhero${p.page ? ' page' : ''}" data-perf="${i}">
        <img src="${src}" alt="${label}"><span class="tick">✓</span><span class="replay">↻</span>
        <div class="wl">${label}</div></button>`;
    }).join('')}</div>`;
  const slot = $('#perfSlot'), label = $('#perfLabel'), againBtn = $('#againBtn');
  const heroes = [...play.querySelectorAll('.perfhero')];
  const done = new Set();
  let busy = false, lastIdx = -1, graceTimer = null, resolved = false;
  return new Promise(resolve => {
    const maybeFinish = () => {
      if (resolved || busy || done.size < cell.perf.length) return;
      clearTimeout(graceTimer);
      graceTimer = setTimeout(() => {
        if (!resolved && !busy){ resolved = true; resolve(); }
      }, 1600);
    };
    const promptNext = () => {
      const nxt = cell.perf.findIndex((p, i) => !done.has(i));
      if (nxt >= 0) sayBubble(`Tap the ${perfLabel(cell.perf[nxt], L)}!`);
    };
    const runPerf = async idx => {
      if (busy || resolved) return;
      busy = true; clearTimeout(graceTimer); againBtn.hidden = true;
      lastIdx = idx;
      await runPerformance(slot, label, cell.perf[idx], L);
      if (!done.has(idx)){ done.add(idx); heroes[idx].classList.add('done'); }
      heroes[idx].classList.add('canreplay');
      busy = false;
      againBtn.hidden = false;
      Music.sfx('good');
      if (done.size < cell.perf.length) promptNext();
      maybeFinish();
    };
    heroes.forEach((h, i) => h.addEventListener('click', () => { Music.sfx('pop'); runPerf(i); }));
    againBtn.addEventListener('click', () => { if (lastIdx >= 0) runPerf(lastIdx); });
    promptNext();
  });
}
async function steamTap(cell){
  const L = G.L, play = $('#steamPlay');
  const target = wordObj(cell.target);
  play.innerHTML = `<div class="cards">${L.words.map(w => `
    <button class="wcard" data-word="${w.word}">
      <img src="${w.img}" alt="${w.word}"><div class="wl">${w.word}</div>
    </button>`).join('')}</div>`;
  await sayBubble(`Tap the ${target.say}!`);
  let misses = 0;
  await new Promise(resolve => {
    const onTap = e => {
      const card = e.target.closest('.wcard');
      if (!card || card.classList.contains('done')) return;
      if (card.dataset.word === target.word){
        card.classList.add('done');
        Music.sfx('good'); sparkles(card, 9); Voice.cheer();
        play.removeEventListener('click', onTap); resolve();
      } else {
        misses++;
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        Music.sfx('try');
        if (misses >= 2){
          const tc = play.querySelector(`[data-word="${target.word}"]`);
          tc.classList.add('hint');
          Voice.say(`Look! Here is the ${target.say}!`);
          setTimeout(() => tc.classList.remove('hint'), 1600);
        } else Voice.say('Try again!');
      }
    };
    play.addEventListener('click', onTap);
  });
}
async function steamCount(cell){
  const play = $('#steamPlay');
  const w = wordObj(cell.word), label = cell.label || w.plural, n = 3;
  play.innerHTML = `<div class="countrow">${Array.from({ length: n }, (_, i) => `
    <button class="ccard scount"><img src="${w.img}" alt="${w.word}"><span class="num">${i + 1}</span></button>`).join('')}</div>`;
  await sayBubble(`Let's count the ${label}! Tap each one!`);
  const NUMS = ['One!', 'Two!', 'Three!'];
  let counted = 0, busyNum = false;
  await new Promise(resolve => {
    play.querySelectorAll('.scount').forEach((c, idx) => {
      c.addEventListener('click', async () => {
        if (c.classList.contains('counted') || busyNum) return;
        busyNum = true;
        c.classList.add('counted'); Music.sfx('pop'); sparkles(c, 5);
        counted++;
        await Voice.say(NUMS[idx]);
        busyNum = false;
        if (counted === n) resolve();
      });
    });
  });
  await Voice.say(`Three ${label}!`);
}
async function steamCount3(){
  const L = G.L, play = $('#steamPlay');
  play.innerHTML = `<div class="countrow">${L.words.map(w => `
    <button class="ccard sc3" data-word="${w.word}"><img src="${w.img}" alt="${w.word}"><span class="num"></span></button>`).join('')}</div>`;
  await sayBubble(`Let's count! Tap each picture!`);
  const NUMS = ['One', 'Two', 'Three'];
  let counted = 0, busyNum = false;
  await new Promise(resolve => {
    play.querySelectorAll('.sc3').forEach(c => {
      c.addEventListener('click', async () => {
        if (c.classList.contains('counted') || busyNum) return;
        busyNum = true;
        c.classList.add('counted'); Music.sfx('pop'); sparkles(c, 5);
        c.querySelector('.num').textContent = counted + 1;
        const line = `${NUMS[counted]}! ${wordObj(c.dataset.word).say}!`;
        counted++;
        await Voice.say(line);
        busyNum = false;
        if (counted === L.words.length) resolve();
      });
    });
  });
}
async function steamSort(){
  const L = G.L, play = $('#steamPlay');
  const ranks = shuffle([3, 2, 1]);
  const widths = { 3: 'min(205px,30vw)', 2: 'min(160px,24vw)', 1: 'min(120px,19vw)' };
  play.innerHTML = `<div class="cards">${L.words.map((w, i) => `
    <button class="wcard ssort" data-size="${ranks[i]}" style="width:${widths[ranks[i]]}">
      <img src="${w.img}" alt="${w.word}"><div class="wl">${w.word}</div>
    </button>`).join('')}</div>`;
  await sayBubble(`Tap the biggest one first!`);
  let expect = 3;
  await new Promise(resolve => {
    const onTap = e => {
      const card = e.target.closest('.ssort');
      if (!card || card.classList.contains('done')) return;
      if (Number(card.dataset.size) === expect){
        card.classList.add('done'); Music.sfx('pop'); sparkles(card, 6);
        if (--expect === 0){ play.removeEventListener('click', onTap); resolve(); }
      } else {
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        Music.sfx('try'); Voice.say('Try again!');
      }
    };
    play.addEventListener('click', onTap);
  });
}
async function steamColour(cell){
  const L = G.L, play = $('#steamPlay');
  const isPage = cell.img === 'page';
  const src = isPage ? L.pageImg : wordObj(cell.img).img;
  const COLOURS = [
    { name: 'Red', css: '#E23B3B' }, { name: 'Blue', css: '#2E7CD6' },
    { name: 'Yellow', css: '#F2C018' }, { name: 'Green', css: '#37A24B' }
  ];
  play.innerHTML = `
    <div class="colourframe${isPage ? ' pagef' : ''}" id="cframe"><img src="${src}" alt="Colour it!"></div>
    <div class="swatchrow">${COLOURS.map(c => `<button class="swatch" data-name="${c.name}" data-css="${c.css}" style="background:${c.css}" aria-label="${c.name}"></button>`).join('')}</div>`;
  await sayBubble('Pick a colour!');
  let taps = 0, busyC = false;
  await new Promise(resolve => {
    play.querySelectorAll('.swatch').forEach(sw => {
      sw.addEventListener('click', async () => {
        if (busyC || taps >= 2) return;
        busyC = true; taps++;
        const f = $('#cframe');
        f.style.borderColor = sw.dataset.css;
        f.style.background = sw.dataset.css + '22';
        Music.sfx('pop'); sparkles(f, 7); Voice.cheer();
        await Voice.say(sw.dataset.name + '!');
        busyC = false;
        if (taps === 2) resolve();
      });
    });
  });
}
async function steamBuild(cell){
  const L = G.L, play = $('#steamPlay');
  const topper = wordObj(cell.img), path = cell.variant === 'path';
  play.innerHTML = `
    <div class="buildarea" id="barea"><div class="${path ? 'stonerow' : 'stack'}" id="bstack"></div></div>
    <button class="bigbtn" id="btap">${path ? '🪨 Tap! Make the path!' : '🧱 Tap! Add a block!'}</button>`;
  await sayBubble(cell.text);
  const COLS = ['#0B5D43', '#C9A227', '#2E7CD6', '#E5639A'];
  const NUMS = ['One!', 'Two!', 'Three!', 'Four!'];
  let built = 0, busyB = false;
  await new Promise(resolve => {
    $('#btap').addEventListener('click', async () => {
      if (busyB || built >= 4) return;
      busyB = true;
      const st = $('#bstack');
      if (path){
        const s = document.createElement('div');
        s.className = 'stone'; s.textContent = '🪨'; st.appendChild(s);
      } else {
        const b = document.createElement('div');
        b.className = 'block'; b.style.background = COLS[built % 4]; st.appendChild(b);
      }
      Music.sfx('pop');
      built++;
      await Voice.say(NUMS[built - 1]);
      busyB = false;
      if (built === 4){
        $('#btap').remove();
        const t = document.createElement('img');
        t.className = 'topper'; t.src = topper.img; t.alt = topper.word;
        if (path) st.appendChild(t); else $('#barea').insertBefore(t, st);
        Music.sfx('good'); sparkles(t, 8); Voice.cheer();
        resolve();
      }
    });
  });
}
async function steamPattern(){
  const play = $('#steamPlay');
  const SEQ = ['k', 'w', 'k', 'w'];
  play.innerHTML = `
    <div class="patdisplay">${SEQ.map(s => `<span class="patdot ${s}"></span>`).join('')}
      <span style="align-self:center;font-weight:800;font-size:22px">➜</span>
      ${SEQ.map(() => `<span class="patdot pslot q">?</span>`).join('')}</div>
    <div class="patiles">
      <button class="patile" data-c="k"><span class="patdot k"></span></button>
      <button class="patile" data-c="w"><span class="patdot w"></span></button>
    </div>`;
  await sayBubble('Black, white, black, white! What comes next?');
  let step = 0, busyP = false;
  await new Promise(resolve => {
    const onTap = async e => {
      const tile = e.target.closest('.patile');
      if (!tile || busyP) return;
      if (tile.dataset.c === SEQ[step]){
        busyP = true;
        const slot = play.querySelectorAll('.pslot')[step];
        slot.className = 'patdot pslot ' + SEQ[step]; slot.textContent = '';
        Music.sfx('pop'); sparkles(tile, 5);
        step++;
        await Voice.say(SEQ[step - 1] === 'k' ? 'Black!' : 'White!');
        busyP = false;
        if (step === 4){ play.removeEventListener('click', onTap); resolve(); }
      } else {
        tile.classList.remove('shake'); void tile.offsetWidth; tile.classList.add('shake');
        Music.sfx('try'); Voice.say('Try again!');
      }
    };
    play.addEventListener('click', onTap);
  });
}
async function phaseSteam(){
  const L = G.L;
  const RENDER = { observe: steamPerform, tap: steamTap, count: steamCount,
    count3: steamCount3, sort: steamSort, colour: steamColour,
    build: steamBuild, pattern: steamPattern };
  stage.innerHTML = `<div class="phase">
      <div class="badges" id="badges">${L.steam.map((c, i) => `<span class="badge b${i}" data-i="${i}">${'STEAM'[i]}</span>`).join('')}</div>
      <div id="steamPlay"></div>
      <p class="steamtext">📖 From your book: <span id="steamText"></span></p>
    </div>`;
  await sayBubble('Now, STEAM Play! Five games from your book page!');
  for (let i = 0; i < L.steam.length; i++){
    const cell = L.steam[i];
    const badge = document.querySelector(`#badges .badge[data-i="${i}"]`);
    badge.classList.add('now');
    $('#steamText').textContent = cell.text;
    await sayBubble(`${cell.strand}!`);
    await RENDER[cell.play](cell);
    badge.classList.remove('now'); badge.classList.add('on');
    G.gems++; setGems(G.gems);
    Music.sfx('good'); Voice.cheer();
    if (i < L.steam.length - 1) await Voice.say(pick(PRAISE));
  }
  setStars(4); Music.sfx('star');
  phaseFinish();
}
function phaseFinish(){
  const L = G.L;
  stage.innerHTML = `<div class="phase">
      <div class="finishstars"><span class="st">⭐</span><span class="st">⭐</span><span class="st">⭐</span><span class="st">⭐</span></div>
      <div class="finishmsg">You learned the letter ${L.upper}!</div>
      <div>
        <button class="bigbtn gold" id="btnAgain">↻ Play Again</button>
        <button class="bigbtn" id="btnHome2">🏠 Home</button>
      </div>
    </div>`;
  document.querySelectorAll('.finishstars .st').forEach((el, i) =>
    setTimeout(() => { el.classList.add('on'); Music.sfx('star'); }, 350 * (i + 1)));
  Confetti.burst(110); Music.sfx('fanfare'); Voice.cheer();
  sayBubble(`Hooray! You did it! You learned the letter ${L.upper}!`);
  $('#btnAgain').addEventListener('click', () => openLetter(L));
  $('#btnHome2').addEventListener('click', goHome);
}
function goHome(){
  // stop any speech and release pending gates
  if ('speechSynthesis' in window) { Voice.queue.forEach(i => i.resolve()); Voice.queue = []; Voice.token++; try{ speechSynthesis.cancel(); }catch(e){} Voice.busy = false; Voice.syncHost(); }
  bubble.textContent = 'Hello!';
  show('screen-home');
}

$('#hostImg').src = DATA.hostImg;
buildGrid();

tglV.addEventListener('click', () => { Voice.setEnabled(!Voice.enabled); paintToggles(); });

paintToggles();
